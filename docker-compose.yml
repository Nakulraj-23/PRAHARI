# Default setup: API on SQLite (a file in the `data` volume) + web dashboard. No Postgres needed.
# Postgres is OPTIONAL and UNTESTED (the agent SQL guard's authorizer/query_only are SQLite-only):
#   docker compose --profile postgres up   with PRAHARI_DB_URL pointing at the postgres service.
#
# First run (data + models are NOT built on start; this is a one-off, ~10 min, ~2.5 GB):
#   docker compose --profile setup run --rm setup        # = make seed train
#   docker compose up --build                            # API :8000, dashboard :5173
# The API starts without models (503 on model endpoints) until the setup step has run.
services:
  api:
    build: .
    environment:
      PRAHARI_DB_URL: sqlite:////data/prahari.db
      PRAHARI_ARTIFACTS_DIR: /data/artifacts
    volumes: ["data:/data"]
    ports: ["8000:8000"]
  setup:
    build: .
    profiles: ["setup"]
    environment:
      PRAHARI_DB_URL: sqlite:////data/prahari.db
      PRAHARI_ARTIFACTS_DIR: /data/artifacts
    volumes: ["data:/data"]
    command: make seed train VENV=/usr/local
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000   # the browser calls the API on the host
    ports: ["5173:80"]
    depends_on: [api]
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: prahari
      POSTGRES_PASSWORD: prahari
      POSTGRES_DB: prahari
    ports: ["5432:5432"]
volumes:
  data:
