[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prahari"
version = "0.1.0"
description = "Telecom NOC AIOps: anomaly detection, alarm validation, RCA, governed remediation"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scikit-learn", "torch", "networkx", "sqlalchemy",
  "fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "pyyaml",
  "onnx", "onnxruntime", "prometheus-client", "httpx", "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["prahari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
